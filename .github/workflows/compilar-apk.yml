
name: Compilar APK Folhear

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair Folhear
        run: unzip -o -q folhear-android-source.zip -d .

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK e NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Preparar Android
        run: npx tauri android init --ci

      - name: Compilar APK
        run: npx tauri android build --apk --debug --target aarch64 --ci

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Folhear-APK-teste
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
